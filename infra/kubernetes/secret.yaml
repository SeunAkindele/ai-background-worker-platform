apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-worker-platform
type: Opaque
stringData:
  # Service DNS names match Service metadata.name below
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ai_worker_platform"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "ai_worker_platform"