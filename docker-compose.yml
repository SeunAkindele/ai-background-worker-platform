# Shared worker env/image via YAML anchors.
x-worker-env: &worker-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_worker_platform
  REDIS_URL: redis://redis:6379/0
  APP_ENV: development
  UPLOAD_DIR: /app/uploads
  MCP_WEB_URL: http://host.docker.internal:8080/mcp

x-worker-common: &worker-common
  image: ai-worker-platform:latest
  restart: unless-stopped
  volumes:
    - upload_data:/app/uploads
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy


services:
  # ============================================================
  # Infrastructure
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_worker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_worker_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_worker_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_worker_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # API Server
  # ============================================================
  api:
    image: ai-worker-platform:latest
    build: .
    container_name: ai_worker_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_worker_platform
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      UPLOAD_DIR: /app/uploads
      MCP_WEB_URL: http://host.docker.internal:8080/mcp
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One Celery service per job type; same image, different --queues / WORKER_TYPE.
  worker-summarization:
    <<: *worker-common
    container_name: ai_worker_summarization
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --pool=solo
      --queues=summarization
      --hostname=summarization@%h
    environment:
      <<: *worker-env
      WORKER_TYPE: summarization

  worker-embeddings:
    <<: *worker-common
    container_name: ai_worker_embeddings
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --pool=solo
      --queues=embeddings
      --hostname=embeddings@%h
    environment:
      <<: *worker-env
      WORKER_TYPE: embeddings

  worker-ocr:
    <<: *worker-common
    container_name: ai_worker_ocr
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --pool=solo
      --queues=ocr
      --hostname=ocr@%h
    environment:
      <<: *worker-env
      WORKER_TYPE: ocr

  worker-transcription:
    <<: *worker-common
    container_name: ai_worker_transcription
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --pool=solo
      --queues=transcription
      --hostname=transcription@%h
    environment:
      <<: *worker-env
      WORKER_TYPE: transcription

  worker-recommendations:
    <<: *worker-common
    container_name: ai_worker_recommendations
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --pool=solo
      --queues=recommendations
      --hostname=recommendations@%h
    environment:
      <<: *worker-env
      WORKER_TYPE: recommendations

  worker-ingestion:
    <<: *worker-common
    container_name: ai_worker_ingestion
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --pool=solo
      --queues=ingestion
      --hostname=ingestion@%h
    environment:
      <<: *worker-env
      WORKER_TYPE: ingestion

  worker-rag-query:
    <<: *worker-common
    container_name: ai_worker_rag_query
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --pool=solo
      --queues=rag_query
      --hostname=rag_query@%h
    environment:
      <<: *worker-env
      WORKER_TYPE: rag_query

volumes:
  postgres_data:
  upload_data: