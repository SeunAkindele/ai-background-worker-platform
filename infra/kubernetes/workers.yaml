# Shared pattern: same image, different WORKER_TYPE + celery --queues
# Scale OCR without scaling summarization: change that Deployment's replicas / HPA.
#
# Resource strategy (Stage 12):
#   summarization / transcription — ML-heavy (BART, Whisper) → ~2Gi memory limit
#   ocr                             — CPU-bound, reads uploaded files → uploads PVC
#   embeddings / recommendations    — lighter models, text-only input → no uploads PVC

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-summarization
  namespace: ai-worker-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
      worker-type: summarization
  template:
    metadata:
      labels:
        app: worker
        worker-type: summarization
    spec:
      containers:
        - name: worker
          image: ai-worker-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - "-A"
            - "app.workers.celery_app"
            - "worker"
            - "--loglevel=info"
            - "--pool=solo"
            - "--queues=summarization"
            - "--hostname=summarization@%h"
          env:
            - name: WORKER_TYPE
              value: summarization
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "celery"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
