apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-ocr
  namespace: ai-worker-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-ocr
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
