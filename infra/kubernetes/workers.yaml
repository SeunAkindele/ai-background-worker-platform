apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ocr
  namespace: ai-worker-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
      worker-type: ocr
  template:
    metadata:
      labels:
        app: worker
        worker-type: ocr
    spec:
      containers:
        - name: worker
          image: ai-worker-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - "-A"
            - "app.workers.celery_app"
            - "worker"
            - "--loglevel=info"
            - "--pool=solo"
            - "--queues=ocr"
            - "--hostname=ocr@%h"
          env:
            - name: WORKER_TYPE
              value: ocr
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "celery"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
